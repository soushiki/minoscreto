# Netlify construye el sitio desde GitHub en cada cambio a main: un solo dist/index.html autocontenido.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La CSP la genera el build en dist/_headers (lleva los hashes de los scripts en línea).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Motor PDFium (ADR-004): el nombre lleva el hash del contenido, así que nunca cambia y se guarda en caché para
# siempre. Netlify ya sirve .wasm como application/wasm; no se fija Content-Type aquí porque la regla cubre
# también worker.<hash>.js. La página descarga ambos con fetch y comprueba su SHA-256 antes de usarlos.
[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
